<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美味外卖 - 登录</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-left">
            <div class="brand-section">
                <div class="brand-logo">
                    <div class="logo-circle">
                        <span class="logo-icon">🍽️</span>
                    </div>
                </div>
                <h1 class="brand-title">美味外卖</h1>
                <p class="brand-desc">美食送到家，美味享不停</p>
                
                <div class="feature-list">
                    <div class="feature-item">
                        <span class="feature-icon">🚀</span>
                        <span class="feature-text">极速配送</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🥘</span>
                        <span class="feature-text">精选商家</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">💰</span>
                        <span class="feature-text">优惠多多</span>
                    </div>
                </div>

                <div class="floating-elements">
                    <span class="float-icon float-1">🍕</span>
                    <span class="float-icon float-2">🍔</span>
                    <span class="float-icon float-3">🍟</span>
                    <span class="float-icon float-4">🥤</span>
                    <span class="float-icon float-5">🍦</span>
                </div>
            </div>
        </div>

        <div class="login-right">
            <div class="login-form-wrapper">
                <div class="role-selector">
                    <div class="role-card active" data-role="customer">
                        <div class="role-icon-wrapper customer-icon">
                            <span>👤</span>
                        </div>
                        <span class="role-name">用户</span>
                    </div>
                    <div class="role-card" data-role="merchant">
                        <div class="role-icon-wrapper merchant-icon">
                            <span>🏪</span>
                        </div>
                        <span class="role-name">商家</span>
                    </div>
                    <div class="role-card" data-role="admin">
                        <div class="role-icon-wrapper admin-icon">
                            <span>🛡️</span>
                        </div>
                        <span class="role-name">管理员</span>
                    </div>
                </div>

                <div class="login-form">
                    <div class="form-group">
                        <label>账号</label>
                        <input type="text" id="login-account" placeholder="请输入账号">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="login-password" placeholder="请输入密码">
                    </div>
                    <button onclick="doLogin()" class="btn-primary login-btn">登 录</button>
                    <p class="link-text" onclick="showRegister()">没有账号？立即注册</p>
                </div>

                <div class="demo-info">
                    <p>📋 测试账号：</p>
                    <div class="demo-accounts">
                        <span>用户：test_user1 / 123456</span>
                        <span>商家：shop_laowang / 123456</span>
                        <span>管理员：admin / admin123</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="register-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>用户注册</h3>
                <button class="close-btn" onclick="closeRegister()">&times;</button>
            </div>
            <div class="form-group">
                <label>账号：</label>
                <input type="text" id="reg-account" placeholder="请输入账号">
            </div>
            <div class="form-group">
                <label>密码：</label>
                <input type="password" id="reg-password" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>昵称：</label>
                <input type="text" id="reg-name" placeholder="请输入昵称">
            </div>
            <div class="form-group">
                <label>手机号：</label>
                <input type="text" id="reg-phone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label>用户类型：</label>
                <select id="reg-user-type">
                    <option value="0">普通用户</option>
                    <option value="1">商家用户</option>
                </select>
            </div>
            <button onclick="doRegister()" class="btn-primary">注 册</button>
            <p class="link-text" onclick="closeRegister()">已有账号？立即登录</p>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script>
        const API_BASE = '/api';
        let currentRole = 'customer';

        document.querySelectorAll('.role-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                currentRole = this.dataset.role;
            });
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2000);
        }

        function showRegister() {
            document.getElementById('register-modal').classList.remove('hidden');
        }

        function closeRegister() {
            document.getElementById('register-modal').classList.add('hidden');
        }

        function doLogin() {
            const account = document.getElementById('login-account').value;
            const password = document.getElementById('login-password').value;
            
            if (!account || !password) {
                showToast('请输入账号和密码');
                return;
            }
            
            fetch(`${API_BASE}/user/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `account=${encodeURIComponent(account)}&password=${encodeURIComponent(password)}`
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 0) {
                    const user = data.data;
                    localStorage.setItem('takeaway_user', JSON.stringify(user));
                    
                    if (user.user_type === 1) {
                        window.location.href = 'merchant.html';
                    } else if (user.user_type === 2 || account === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'customer.html';
                    }
                } else {
                    showToast(data.message || '登录失败');
                }
            })
            .catch(err => {
                console.error(err);
                showToast('网络连接失败');
            });
        }

        function doRegister() {
            const account = document.getElementById('reg-account').value;
            const password = document.getElementById('reg-password').value;
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const userType = document.getElementById('reg-user-type').value;
            
            if (!account || !password) {
                showToast('账号和密码不能为空');
                return;
            }
            
            fetch(`${API_BASE}/user/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `account=${encodeURIComponent(account)}&password=${encodeURIComponent(password)}&user_name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&user_type=${encodeURIComponent(userType)}`
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 0) {
                    showToast('注册成功，请登录');
                    closeRegister();
                } else {
                    showToast(data.message);
                }
            })
            .catch(err => showToast('注册失败'));
        }
    </script>
</body>
</html>
